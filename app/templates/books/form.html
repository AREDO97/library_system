{% extends "base.html" %}
{% block title %}{{ 'Edit Book' if book else 'Add New Book' }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">{{ 'Update Book Details' if book else 'Add New Book to Catalogue' }}</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Book Title</label>
            <input type="text" name="title" value="{{ book.title if book else '' }}" class="form-control" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Author</label>
              <input type="text" name="author" value="{{ book.author if book else '' }}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">ISBN</label>
              <input type="text" name="isbn" value="{{ book.isbn if book else '' }}" class="form-control" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Publisher</label>
              <input type="text" name="publisher" value="{{ book.publisher if book else '' }}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Publication Year</label>
              <input type="number" name="publication_year" value="{{ book.publication_year if book else 2026 }}" class="form-control" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Category</label>
              <input type="text" name="category" value="{{ book.category if book else 'General' }}" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Total Quantity</label>
              <input type="number" name="quantity" min="1" value="{{ book.total_quantity if book else 1 }}" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Shelf Location</label>
              <input type="text" name="shelf_location" placeholder="e.g. B2-Shelf4" value="{{ book.shelf_location if book else '' }}" class="form-control" required>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">{{ 'Save Changes' if book else 'Add Book' }}</button>
            <a href="{{ url_for('books.index') }}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
